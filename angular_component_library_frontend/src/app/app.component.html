<style>
  .demo-hero {
    min-height: 70vh;
    background: radial-gradient(1200px 600px at 20% 0%, rgba(37,99,235,.18), transparent), #0b1220;
    color: #fff;
    padding-bottom: 48px;
  }
  .demo-hero__inner {
    max-width: 1200px; margin: 0 auto; padding: 16px 24px 24px;
    display: grid; grid-template-columns: 1.2fr .8fr; gap: 24px; align-items: center;
  }
  @media (max-width: 900px) {
    .demo-hero__inner { grid-template-columns: 1fr; }
  }
</style>
<div class="demo-hero">
  <lib-app-header [translucent]="true"></lib-app-header>
  <div class="demo-hero__inner">
    <lib-hero-copy-block></lib-hero-copy-block>
    <div style="display:flex; justify-content:flex-end;">
      <lib-hero-card></lib-hero-card>
    </div>
  </div>
</div>
