<section class="hero-card ocn-card">
  <img class="hero-card__image" [src]="image" alt="" />
  <div class="hero-card__body">
    <div class="hero-card__eyebrow">{{ eyebrow }}</div>
    <div class="hero-card__title">{{ title }}</div>
    <button class="ocn-cta hero-card__cta">{{ cta }}</button>
    <div class="hero-card__dots" aria-hidden="true">
      <span class="dot dot--lg"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>
</section>
